<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="box">
        <section class="box-upper">
           <h1>Expense Tracker</h1>
           <div class="balance">
            <h2>$0.00</h2>
            <h3>Balance</h3>
        </div>
    </section>
    <div class="transaction-container">
        <h3>Transactions</h3>
        <hr>
        
        <div class="transactions"></div>
    </div>
    <section class="transaction-form">
        <h3>Add Transaction</h3>
        <form id="form">
            <div class="inputs">
                <div class="form-control">
                    <label for="text">Text:</label>
                    <input type="text" id="text" name="text" placeholder="Enter Description" required>
                </div>
                <div class="form-control">
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" name="amount" placeholder="Enter Amount" min="0.01"step="0.01" required>
                </div>
            </div>
            <div class="buttons-container">
                <button type="submit" id="earnBtn">
                    <p>$0.00</p>
                    <p>Earning</p>
                </button>
                <button type="submit" id="expenseBtn">
                    <p>$0.00</p>
                    <p>Expense</p>
                </button>
            </div>
        </form>
    </section>
</div>
</div>

<script src="script.js"></script>

</body>
</html>
